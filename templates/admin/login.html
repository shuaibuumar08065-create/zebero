<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login - ZEBERO</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.login-box{
width:90%;
max-width:380px;
background:#ffffff;
padding:30px;
border-radius:20px;
box-shadow:0 15px 40px rgba(0,0,0,.2);
}

h2{
text-align:center;
margin-bottom:25px;
color:#0b7d57;
}

input{
width:100%;
padding:14px;
margin-bottom:15px;
border:1px solid #ddd;
border-radius:12px;
outline:none;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#0b7d57;
color:#fff;
font-size:16px;
cursor:pointer;
}

.error{
color:red;
margin-bottom:15px;
text-align:center;
}

</style>

</head>
<body>

<div class="login-box">

<h2>ZEBERO ADMIN</h2>

{% if error %}
<div class="error">{{ error }}</div>
{% endif %}

<form method="POST">

<input
type="text"
name="username"
placeholder="Username"
required>

<input
type="password"
name="password"
placeholder="Password"
required>

<button type="submit">
Login
</button>

</form>

</div>

</body>
</html>
