<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Add Account - ZEBERO</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/withdraw.css') }}">
</head>
<body>

<div class="withdraw-page">

    <!-- HEADER -->
    <header class="withdraw-header">
        <a href="{{ url_for('withdraw.withdraw') }}" class="back-btn">←</a>
        <div class="header-title">
            <h1>Add Account</h1>
            <p>Withdrawal account</p>
        </div>
    </header>

    <main class="withdraw-content">

        <div class="add-card">

            <div class="add-icon">🏦</div>
            <h2>Bank Account</h2>
            <p class="add-desc">
                Add your Nigerian bank account to receive your withdrawal.
            </p>

            <!-- BANK SEARCH -->
            <div class="form-group">
                <label>Bank</label>
                <div class="search-wrapper">
                    <input 
                        type="text" 
                        id="bank-search" 
                        placeholder="Search bank name..."
                        autocomplete="off"
                    >
                    <div id="bank-list" class="bank-dropdown hidden"></div>
                </div>
                <input type="hidden" id="bank-code">
                <input type="hidden" id="bank-name">
            </div>

            <!-- ACCOUNT NUMBER -->
            <div class="form-group">
                <label>Account Number</label>
                <input 
                    type="text" 
                    id="account-number" 
                    placeholder="Enter 10-digit account number"
                    maxlength="10"
                    inputmode="numeric"
                >
            </div>

            <!-- ACCOUNT NAME (after verify) -->
            <div id="account-name-box" class="account-name-box hidden">
                <div class="verified-icon">✓</div>
                <div>
                    <small>Account Name</small>
                    <strong id="resolved-name"></strong>
                </div>
            </div>

            <div id="message" class="message hidden"></div>

            <button type="button" id="verify-btn" class="withdraw-btn">
                Verify Account
            </button>

            <button type="button" id="save-btn" class="withdraw-btn hidden" style="margin-top:12px;">
                Save Account
            </button>

        </div>

        <!-- SECURITY NOTE -->
        <div class="security-box">
            <span>🔒</span>
            <div>
                <strong>Your account is secure</strong>
                <p>We verify your bank details before saving them.</p>
            </div>
        </div>

    </main>
</div>

<script>
let banks = [];
let selectedBank = null;

// Load banks
async function loadBanks() {
    try {
        const res = await fetch("/withdraw/banks");
        const data = await res.json();
        banks = data.data || data || [];
    } catch (e) {
        console.error(e);
    }
}

loadBanks();

const searchInput = document.getElementById("bank-search");
const bankList = document.getElementById("bank-list");
const bankCode = document.getElementById("bank-code");
const bankName = document.getElementById("bank-name");

searchInput.addEventListener("input", function () {
    const q = this.value.toLowerCase().trim();
    bankList.innerHTML = "";

    if (q.length < 1) {
        bankList.classList.add("hidden");
        return;
    }

    const filtered = banks.filter(b => 
        (b.name || b.bank_name || "").toLowerCase().includes(q)
    ).slice(0, 12);

    if (filtered.length === 0) {
        bankList.classList.add("hidden");
        return;
    }

    filtered.forEach(bank => {
        const item = document.createElement("div");
        item.className = "bank-item";
        item.textContent = bank.name || bank.bank_name;
        item.onclick = () => {
            searchInput.value = bank.name || bank.bank_name;
            bankCode.value = bank.code || bank.bank_code;
            bankName.value = bank.name || bank.bank_name;
            selectedBank = bank;
            bankList.classList.add("hidden");
        };
        bankList.appendChild(item);
    });

    bankList.classList.remove("hidden");
});

document.addEventListener("click", (e) => {
    if (!e.target.closest(".search-wrapper")) {
        bankList.classList.add("hidden");
    }
});

// Verify
document.getElementById("verify-btn").addEventListener("click", async function () {
    const accountNumber = document.getElementById("account-number").value.trim();
    const code = bankCode.value;
    const msg = document.getElementById("message");
    const nameBox = document.getElementById("account-name-box");
    const saveBtn = document.getElementById("save-btn");

    msg.className = "message hidden";
    nameBox.classList.add("hidden");
    saveBtn.classList.add("hidden");

    if (!code) {
        msg.textContent = "Please select a bank.";
        msg.className = "message error";
        return;
    }
    if (accountNumber.length !== 10) {
        msg.textContent = "Account number must be 10 digits.";
        msg.className = "message error";
        return;
    }

    this.disabled = true;
    this.textContent = "Verifying...";

    try {
        const res = await fetch("/withdraw/verify-account", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                account_number: accountNumber,
                bank_code: code
            })
        });

        const data = await res.json();

        if (data.status === "success" || data.account_name) {
            document.getElementById("resolved-name").textContent = data.account_name || data.data?.account_name;
            nameBox.classList.remove("hidden");
            saveBtn.classList.remove("hidden");
            msg.textContent = "Account verified successfully!";
            msg.className = "message success";
        } else {
            msg.textContent = data.message || "Could not verify account.";
            msg.className = "message error";
        }
    } catch (e) {
        msg.textContent = "Verification failed. Try again.";
        msg.className = "message error";
    }

    this.disabled = false;
    this.textContent = "Verify Account";
});

// Save
document.getElementById("save-btn").addEventListener("click", async function () {
    const accountNumber = document.getElementById("account-number").value.trim();
    const code = bankCode.value;
    const name = document.getElementById("resolved-name").textContent;
    const bName = bankName.value;
    const msg = document.getElementById("message");

    this.disabled = true;
    this.textContent = "Saving...";

    try {
        const res = await fetch("/withdraw/save-account", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                account_number: accountNumber,
                bank_code: code,
                bank_name: bName,
                account_name: name
            })
        });

        const data = await res.json();

        if (data.status === "success") {
            msg.textContent = "Account saved successfully!";
            msg.className = "message success";
            setTimeout(() => {
                window.location.href = "/withdraw";
            }, 1000);
        } else {
            msg.textContent = data.message || "Failed to save account.";
            msg.className = "message error";
            this.disabled = false;
            this.textContent = "Save Account";
        }
    } catch (e) {
        msg.textContent = "Something went wrong.";
        msg.className = "message error";
        this.disabled = false;
        this.textContent = "Save Account";
    }
});
</script>
<script>
history.pushState(null, "", location.href);
window.onpopstate = function () {
    window.location.href = "/dashboard";
};
</script>

</body>
</html>
