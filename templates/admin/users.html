<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Users - ZEBERO</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f5f5f5;
padding:20px;
}

table{
width:100%;
border-collapse:collapse;
background:#fff;
}

th,td{
padding:12px;
border:1px solid #ddd;
text-align:left;
font-size:14px;
}

th{
background:#0b7d57;
color:white;
}

img{
width:40px;
height:40px;
border-radius:50%;
}

</style>

</head>

<body>

<h2>Registered Users</h2>

<table>

<tr>

<th>ID</th>

<th>Photo</th>

<th>Username</th>

<th>Email</th>

<th>Date</th>

</tr>

{% for user in users %}

<tr>

<td>{{ user.id }}</td>

<td>
<img src="{{ user.picture }}">
</td>

<td>{{ user.username }}</td>

<td>{{ user.email }}</td>

<td>{{ user.created_at }}</td>

</tr>

{% endfor %}

</table>

</body>

</html>
