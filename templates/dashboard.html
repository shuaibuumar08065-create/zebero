<!DOCTYPE html>
<html lang="en">
<head>
<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<meta name="theme-color" content="#0a8f63">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ZEBERO">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='images/logo.png') }}">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ZEBERO Dashboard</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>
<body>

<div class="dashboard-page">

    <!-- HEADER -->
    <header class="dash-header">
        <div class="logo">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="ZEBERO">
            <span>ZEBERO</span>
        </div>

        <div class="avatar-menu">
            <button class="avatar" id="avatarBtn" type="button">
                <span>{{ (user.username or 'U')[0]|upper }}</span>
            </button>

            <div class="dropdown" id="avatarDropdown">
                <a href="/support" class="dropdown-item">
                    <span>💬</span> Support
                </a>
                <a href="/logout" class="dropdown-item logout">
                    <span>🚪</span> Log out
                </a>
            </div>
        </div>
    </header>

    <!-- BALANCE CARD -->
    <section class="balance-card">
        <div class="balance-top">
            <span class="balance-label">AVAILABLE BALANCE</span>
            <button class="hide-btn" id="hideBalance" type="button">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                </svg>
                Hide
            </button>
        </div>
        <h1 class="balance-amount" id="balanceAmount">₦{{ "%.2f"|format(user.balance or 0) }}</h1>
        <div class="balance-actions">
            <a href="/withdraw" class="btn-withdraw">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M12 19V5M5 12l7-7 7 7"/>
                </svg>
                Withdraw
            </a>
            <a href="/deposit" class="btn-deposit">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M12 5v14M5 12h14"/>
                </svg>
                Deposit
            </a>
        </div>
    </section>

    <!-- QUICK SERVICES -->
    <h3 class="section-title">Quick Services</h3>
    <div class="services-grid">
        <a href="/daily-check" class="service-card">
            <div class="service-icon green">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0a8f63" stroke-width="2">
                    <rect x="3" y="4" width="18" height="18" rx="2"/>
                    <path d="M16 2v4M8 2v4M3 10h18"/>
                    <path d="M9 16l2 2 4-4"/>
                </svg>
            </div>
            <span>Daily Check</span>
        </a>
        <a href="/referral" class="service-card">
            <div class="service-icon blue">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                    <circle cx="9" cy="7" r="4"/>
                    <path d="M19 8v6M22 11h-6"/>
                </svg>
            </div>
            <span>Referral<br>Program</span>
        </a>
        <a href="https://t.me/ZEBERONEWS" target="_blank" class="service-card">
            <div class="service-icon sky">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="#0ea5e9">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-.08-.06-.19-.04-.27-.02-.12.02-1.96 1.25-5.54 3.69-.52.36-1 .53-1.42.52-.47-.01-1.37-.26-2.03-.48-.82-.27-1.47-.42-1.42-.88.03-.24.37-.49 1.02-.74 3.98-1.74 6.64-2.89 7.98-3.45 3.8-1.6 4.59-1.88 5.11-1.89.11 0 .37.03.53.16.14.11.18.26.2.37-.01.06-.01.24-.01.24z"/>
                </svg>
            </div>
            <span>Telegram<br>Group</span>
        </a>
    </div>

    <!-- ACCOUNT STATUS -->
    <div class="status-card">
        <div class="status-left">
            <div class="status-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="#f59e0b">
                    <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
                </svg>
            </div>
            <div>
                <strong>Account Status</strong>
                <small>Basic Membership</small>
            </div>
        </div>
        <a href="/upgrade" class="upgrade-btn">Upgrade</a>
    </div>

</div>

<nav class="bottom-nav">
    <a href="/dashboard" class="active">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 3L4 9v12h5v-7h6v7h5V9l-8-6z"/>
        </svg>
        <span>Home</span>
    </a>
    <a href="/earn">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M21 7H3c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V9c0-1.1-.9-2-2-2zm0 12H3V9h18v10zm-9-7c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3z"/>
        </svg>
        <span>Earn</span>
    </a>
    <a href="/referral">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
        </svg>
        <span>Referral</span>
    </a>
    <a href="/upgrade">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2l2.4 7.2h7.6l-6 4.8 2.3 7.2-6.3-4.8-6.3 4.8 2.3-7.2-6-4.8h7.6z"/>
        </svg>
        <span>Premium</span>
    </a>
</nav>

<script>
// Hide / Show balance - yana ajiye state
const balanceEl = document.getElementById("balanceAmount");
const hideBtn = document.getElementById("hideBalance");
const realBalance = "₦{{ '%.2f'|format(user.balance or 0) }}";

function applyBalanceState() {
    const hidden = localStorage.getItem("balanceHidden") === "1";
    if (hidden) {
        balanceEl.textContent = "₦••••••";
        hideBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg> Show';
    } else {
        balanceEl.textContent = realBalance;
        hideBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg> Hide';
    }
}

hideBtn.addEventListener("click", function () {
    const currentlyHidden = localStorage.getItem("balanceHidden") === "1";
    localStorage.setItem("balanceHidden", currentlyHidden ? "0" : "1");
    applyBalanceState();
});

// Ayi apply lokacin da page ya load
applyBalanceState();

// Avatar dropdown
const avatarBtn = document.getElementById("avatarBtn");
const avatarDropdown = document.getElementById("avatarDropdown");

if (avatarBtn) {
    avatarBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        avatarDropdown.classList.toggle("show");
    });
    document.addEventListener("click", function () {
        avatarDropdown.classList.remove("show");
    });
}
</script>
<script>
history.pushState(null, "", location.href);
window.onpopstate = function () {
    history.go(1);
};
</script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/static/sw.js").catch(function () {});
}
</script>

</body>
</html>
